<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#172033}
header{background:linear-gradient(135deg,#173b73,#2463a8);color:#fff;padding:24px 16px;text-align:center}
header h1{margin:0 0 6px;font-size:24px}
header p{margin:0;opacity:.92}
.container{max-width:760px;margin:0 auto;padding:16px}
.top{background:#fff;border-radius:16px;padding:15px;box-shadow:0 3px 14px #0001;margin-bottom:14px}
.progress-wrap{height:10px;background:#e7ebf0;border-radius:99px;overflow:hidden}
#progress{height:100%;width:1%;background:#2463a8;transition:.25s}
.status{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:14px;color:#536070}
.counters{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.counter{padding:8px 13px;border-radius:999px;font-weight:700;font-size:14px}
.correct-counter{color:#28784b;background:#edf8f1}
.wrong-counter{color:#b43b3b;background:#fff0f0}
.card{background:#fff;border-radius:18px;padding:22px 18px;box-shadow:0 5px 20px #0001}
.topic{display:inline-block;background:#eaf2fb;color:#2463a8;font-weight:bold;padding:7px 10px;border-radius:8px;font-size:13px}
.situation{margin-top:15px;color:#687386;font-size:14px}
.question{font-size:21px;line-height:1.45;font-weight:700;margin:12px 0 18px;min-height:60px}
.options{display:grid;gap:11px}
.option{width:100%;border:2px solid #dce3ec;background:#fff;border-radius:12px;padding:14px 15px;text-align:left;font-size:17px;cursor:pointer;transition:.15s}
.option:hover:not(:disabled){background:#f5f8fc;border-color:#9fb9d8}
.option:disabled{cursor:default}
.option.correct{background:#eaf8ef;border-color:#42a56b;color:#17683a;font-weight:700}
.option.wrong{background:#fff0f0;border-color:#d85c5c;color:#9d2626;font-weight:700}
.option.selected{box-shadow:0 0 0 2px #2463a8 inset}
.feedback{margin-top:15px;padding:12px 14px;border-radius:10px;font-size:16px;font-weight:600}
.correct-feedback{background:#edf8f1;color:#28784b}
.wrong-feedback{background:#fff0f0;color:#b43b3b}
.explanation{margin-top:10px;padding:12px 14px;border-left:4px solid #2463a8;background:#f5f8fc;color:#536070;line-height:1.45}
.next{display:none;width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px;background:#2463a8;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
#final{display:none;text-align:center}
.score{font-size:30px;font-weight:800;margin:15px 0}
.restart{border:0;border-radius:12px;padding:13px 20px;background:#2463a8;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
@media(max-width:520px){
  header h1{font-size:20px}
  .container{padding:10px}
  .card{padding:18px 14px}
  .question{font-size:19px}
  .option{font-size:16px;padding:13px}
}
</style>
</head>
<body>
<header>
<h1>Práctica del Cuadernillo I</h1>

</header>

<div class="container">

      <span>Progreso: <b id="percent">1%</b></span>
    </div>
    <div class="counters">

    </div>

  <div class="card" id="card">

    <div class="situation" id="situation"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" style="display:none"></div>
    <div class="explanation" id="explanation" style="display:none"></div>
    <button class="next" id="nextBtn" type="button">Siguiente →</button>
  </div>

  <div class="card" id="final">
    <h2>¡Práctica terminada!</h2>
    <div class="score" id="finalScore"></div>
    <p id="finalMessage"></p>

</div>

let current = 0;
let correct = 0;
let wrong = 0;
let answered = false;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const topicEl = document.getElementById("topic");
const situationEl = document.getElementById("situation");
const feedbackEl = document.getElementById("feedback");
const explanationEl = document.getElementById("explanation");
const nextBtn = document.getElementById("nextBtn");
const progressEl = document.getElementById("progress");
const currentNumEl = document.getElementById("currentNum");
const totalNumEl = document.getElementById("totalNum");
const percentEl = document.getElementById("percent");
const correctCountEl = document.getElementById("correctCount");
const wrongCountEl = document.getElementById("wrongCount");
const cardEl = document.getElementById("card");
const finalEl = document.getElementById("final");
const finalScoreEl = document.getElementById("finalScore");
const finalMessageEl = document.getElementById("finalMessage");
const restartBtn = document.getElementById("restartBtn");

totalNumEl.textContent = questions.length;

function renderQuestion() {
  const q = questions[current];
  answered = false;

  topicEl.textContent = q.topic || "";
  situationEl.textContent = q.situation || "";
  questionEl.textContent = q.question || "";
  optionsEl.innerHTML = "";
  feedbackEl.style.display = "none";
  explanationEl.style.display = "none";
  nextBtn.style.display = "none";

  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.type = "button";
    btn.textContent = opt;
    btn.addEventListener("click", () => checkAnswer(i, btn));
    optionsEl.appendChild(btn);
  });

  const pct = Math.round(((current + 1) / questions.length) * 100);
  progressEl.style.width = pct + "%";
  currentNumEl.textContent = current + 1;
  percentEl.textContent = pct + "%";
  correctCountEl.textContent = correct;
  wrongCountEl.textContent = wrong;
}

function isCorrect(q, index) {
  // Supports both answer formats used in the original file:
  // numeric option index (e.g. alphabet) and answer text (other topics).
  return index === q.answer || q.options[index] === q.answer;
}

function checkAnswer(index, clickedBtn) {
  if (answered) return;
  answered = true;

  const q = questions[current];
  const buttons = [...document.querySelectorAll(".option")];
  const rightIndex = typeof q.answer === "number"
    ? q.answer
    : q.options.indexOf(q.answer);

  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === rightIndex) b.classList.add("correct");
  });

  if (isCorrect(q, index)) {
    correct++;
    clickedBtn.classList.add("selected");
    feedbackEl.textContent = "✓ Correcto";
    feedbackEl.className = "feedback correct-feedback";
  } else {
    wrong++;
    clickedBtn.classList.add("wrong");
    feedbackEl.textContent = "✗ Incorrecto";
    feedbackEl.className = "feedback wrong-feedback";
  }

  feedbackEl.style.display = "block";
  explanationEl.textContent = q.explanation || "";
  explanationEl.style.display = q.explanation ? "block" : "none";
  correctCountEl.textContent = correct;
  wrongCountEl.textContent = wrong;
  nextBtn.style.display = "block";
  nextBtn.textContent = current < questions.length - 1 ? "Siguiente →" : "Ver resultado";
}

nextBtn.addEventListener("click", () => {
  if (!answered) return;
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
    window.scrollTo({top:0, behavior:"smooth"});
  } else {
    showFinal();
  }
});

function showFinal() {
  cardEl.style.display = "none";
  finalEl.style.display = "block";
  const pct = Math.round((correct / questions.length) * 100);
  finalScoreEl.textContent = `${correct} / ${questions.length} (${pct}%)`;
  finalMessageEl.textContent = `Correctas: ${correct} · Incorrectas: ${wrong}`;
  progressEl.style.width = "100%";
  percentEl.textContent = "100%";
}

restartBtn.addEventListener("click", () => {
  current = 0;
  correct = 0;
  wrong = 0;
  finalEl.style.display = "none";
  cardEl.style.display = "block";
  renderQuestion();
  window.scrollTo({top:0, behavior:"smooth"});
});

renderQuestion();
