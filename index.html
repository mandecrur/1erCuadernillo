*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#172033}
header{background:linear-gradient(135deg,#173b73,#2463a8);color:white;padding:24px 16px;text-align:center}
header h1{margin:0 0 6px;font-size:25px}
header p{margin:0;opacity:.9}
.container{max-width:760px;margin:0 auto;padding:16px}
.top{background:white;border-radius:16px;padding:15px;box-shadow:0 3px 14px #0001;margin-bottom:14px}
.progress-wrap{height:10px;background:#e7ebf0;border-radius:99px;overflow:hidden}
#progress{height:100%;width:1%;background:#2463a8;transition:.25s}
.status{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:14px;color:#536070}

.counters{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.counter{padding:8px 13px;border-radius:999px;font-weight:700;font-size:14px;background:#f2f4f7}
.correct-counter{color:#28784b;background:#edf8f1}
.wrong-counter{color:#b43b3b;background:#fff0f0}
.card{background:white;border-radius:18px;padding:22px 18px;box-shadow:0 5px 20px #0001}
.topic{display:inline-block;background:#eaf2fb;color:#2463a8;font-weight:bold;padding:7px 10px;border-radius:8px;font-size:13px}
.situation{margin-top:15px;color:#687386;font-size:14px}
.question{font-size:21px;line-height:1.4;margin:10px 0 20px;font-weight:700}
.options{display:grid;gap:10px}
.option{width:100%;text-align:left;border:2px solid #dce3eb;background:#fff;padding:14px;border-radius:12px;font-size:16px;cursor:pointer}
.option:hover{border-color:#2463a8}
.option.selected{border-color:#2463a8;background:#eef5fd}
.option.correct{border-color:#38865a;background:#edf8f1}
.option.wrong{border-color:#c44;background:#fff0f0}
.feedback{margin-top:16px;padding:13px;border-radius:12px;display:none;line-height:1.45}
.feedback.show{display:block}
.feedback.ok{background:#edf8f1;color:#245c3b}
.feedback.bad{background:#fff0f0;color:#8b2525}
.actions{display:flex;gap:10px;margin-top:18px}
button.main{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer;background:#2463a8;color:white}
button.main:disabled{opacity:.45;cursor:not-allowed}
button.secondary{background:#eef1f5;color:#26364b}
#result{display:none;text-align:center;background:white;border-radius:18px;padding:28px 18px;box-shadow:0 5px 20px #0001}
.score{font-size:48px;font-weight:800;color:#2463a8}
@media(max-width:480px){header h1{font-size:21px}.question{font-size:19px}.container{padding:10px}.card{padding:18px 14px}}
</style>
</head>

</div>
</div>
<div id="result">

const questions = __QUESTIONS__;

let current = 0;
let correct = 0;
let wrong = 0;
let answered = false;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const topicEl = document.getElementById("topic");
const situationEl = document.getElementById("situation");
const feedbackEl = document.getElementById("feedback");
const explanationEl = document.getElementById("explanation");
const nextBtn = document.getElementById("nextBtn");
const progressEl = document.getElementById("progress");
const currentNumEl = document.getElementById("currentNum");
const totalNumEl = document.getElementById("totalNum");
const percentEl = document.getElementById("percent");
const correctCountEl = document.getElementById("correctCount");
const wrongCountEl = document.getElementById("wrongCount");
const finalEl = document.getElementById("final");
const finalScoreEl = document.getElementById("finalScore");
const finalMessageEl = document.getElementById("finalMessage");

totalNumEl.textContent = questions.length;

function renderQuestion(){
  const q = questions[current];
  answered = false;

  topicEl.textContent = q.topic;
  situationEl.textContent = q.situation || "";
  questionEl.textContent = q.question;
  optionsEl.innerHTML = "";
  feedbackEl.style.display = "none";
  explanationEl.style.display = "none";
  nextBtn.style.display = "none";

  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.type = "button";
    btn.textContent = opt;
    btn.addEventListener("click", () => checkAnswer(i, btn));
    optionsEl.appendChild(btn);
  });

  const pct = Math.round((current / questions.length) * 100);
  progressEl.style.width = Math.max(1, pct) + "%";
  currentNumEl.textContent = current + 1;
  percentEl.textContent = pct + "%";
  correctCountEl.textContent = correct;
  wrongCountEl.textContent = wrong;
  window.scrollTo({top:0, behavior:"smooth"});
}

function checkAnswer(index, clickedBtn){
  if(answered) return;
  answered = true;

  const q = questions[current];
  const buttons = [...document.querySelectorAll(".option")];
  buttons.forEach((b, i) => {
    b.disabled = true;
    if(i === q.answer) b.classList.add("correct");
  });

  if(index === q.answer){
    correct++;
    clickedBtn.classList.add("selected");
    feedbackEl.innerHTML = "✓ <b>Correct!</b>";
    feedbackEl.className = "feedback correct-feedback";
  }else{
    wrong++;
    clickedBtn.classList.add("wrong");
    feedbackEl.innerHTML = "✗ <b>Incorrect.</b>";
    feedbackEl.className = "feedback wrong-feedback";
  }

  feedbackEl.style.display = "block";
  explanationEl.textContent = q.explanation || "";
  explanationEl.style.display = "block";

  correctCountEl.textContent = correct;
  wrongCountEl.textContent = wrong;

  if(current < questions.length - 1){
    nextBtn.textContent = "Siguiente →";
    nextBtn.style.display = "block";
  }else{
    nextBtn.textContent = "Ver resultado";
    nextBtn.style.display = "block";
  }
}

nextBtn.addEventListener("click", () => {
  if(current < questions.length - 1){
    current++;
    renderQuestion();
  }else{
    showFinal();
  }
});

function showFinal(){
  document.querySelector(".card").style.display = "none";
  finalEl.style.display = "block";
  const pct = Math.round((correct / questions.length) * 100);
  finalScoreEl.textContent = `${correct} / ${questions.length} (${pct}%)`;
  finalMessageEl.textContent =
    `Correctas: ${correct} · Incorrectas: ${wrong}`;
  progressEl.style.width = "100%";
  percentEl.textContent = "100%";
}

function resetQuiz(){
  current = 0;
  correct = 0;
  wrong = 0;
  document.querySelector(".card").style.display = "block";
  finalEl.style.display = "none";
  renderQuestion();
}

renderQuestion();
</script>
